name: Atualizar publicação do Instagram
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: instagram-cache
  cancel-in-progress: false
jobs:
  sync:
    # Opt-in after configuring the store account; disabled by default.
    if: vars.INSTAGRAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Sincronizar cache público
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_HOST: ${{ vars.INSTAGRAM_API_HOST }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
        run: node scripts/sync-instagram.mjs
      - name: Salvar somente alterações do Instagram
        run: |
          git add data/instagram.json imagens/instagram/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualiza publicação do Instagram'
          git push
